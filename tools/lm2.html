<html><body><script type="module">
import {FaceLandmarker, FilesetResolver} from './node_modules/@mediapipe/tasks-vision/vision_bundle.mjs';
window.run = async (files)=>{
  const fs = await FilesetResolver.forVisionTasks('./node_modules/@mediapipe/tasks-vision/wasm');
  const fl = await FaceLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'./face_landmarker.task',delegate:'CPU'},runningMode:'IMAGE',numFaces:4,outputFacialTransformationMatrixes:true,outputFaceBlendshapes:true});
  const out={};
  for(const f of files){
    const img=new Image(); img.src=f; await img.decode();
    const r=fl.detect(img);
    out[f]={w:img.naturalWidth,h:img.naturalHeight,faces:r.faceLandmarks.map((l,i)=>({lm:l.map(p=>[p.x,p.y,p.z]),mat:r.facialTransformationMatrixes[i]?.data?Array.from(r.facialTransformationMatrixes[i].data):null}))};
  }
  return out;
};
window.ready=true;
</script></body></html>
