<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lineup</title>
<style>html,body{margin:0;height:100%;background:#2a2c30;overflow:hidden}canvas{display:block}
.lbl{position:absolute;font:bold 14px sans-serif;color:#fff;text-shadow:0 1px 2px #000;pointer-events:none}</style>
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/jsm/"}}</script>
</head>
<body>
<script type="module">
// Proportion lineup: every fighter standing relaxed (arms hanging), front and side, orthographic, over a 10 cm
// ruler; ticks mark each fighter's anthropometric landmarks (elbow 0.63 H, wrist 0.485 H, fingertips 0.377 H).
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { loadCharacterData, buildCharacter, texturesReady } from './js/charloader.js';
import { makeFighterMaterial } from './js/materials.js';
import { Rig, newPose, POSE } from './js/anim/rig.js';
import { BASE } from './js/anim/poses.js';
import { Accessories } from './js/fx/accessories.js';
import { STYLES } from './js/fight/styles.js';
const q = new URLSearchParams(location.search);
const W = +q.get('w') || innerWidth, H = +q.get('h') || innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(W, H); renderer.toneMapping = THREE.AgXToneMapping;
renderer.setScissorTest(true); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a2c30);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.8;
const key = new THREE.DirectionalLight(0xfff1e0, 2.2); key.position.set(1, 3, 4); scene.add(key);
const ids = (q.get('ids') || 'alejandro,arnau,camilo,rafa,zapponi,dani,noemi').split(',');
const gap = 0.8;
const lm = [];
for (let i = 0; i < ids.length; i++) {
  const d = await loadCharacterData(ids[i]);
  const ch = buildCharacter(d, makeFighterMaterial);
  new Accessories().attach(ch, STYLES[ids[i]], d.meta);
  const rig = new Rig(ch), p = newPose();
  const set = (k, v) => { const o = POSE[k][0]; if (Array.isArray(v)) v.forEach((x, j) => (p[o + j] = x)); else p[o] = v; };
  // relaxed standing: feet under the hips, arms hanging by the sides
  for (const s of ['L', 'R']) {
    set('hand' + s, [0.05, -1.0, 0.0]); set('aim' + s, 1); set('fist' + s, 0.0); set('pole' + s, [0.1, -0.3, -1]);
    set('foot' + s, [0.11, 0.071, 0.0]); set('knee' + s, [0.05, 0, 1]); set('hg' + s, 0);
  }
  set('look', 0);
  rig.apply(p);
  ch.group.position.x = (i - (ids.length - 1) / 2) * gap;
  scene.add(ch.group);
  ch.group.updateMatrixWorld(true);
  let top = 0; ch.meshes.head.geometry.computeBoundingBox(); top = ch.meshes.head.geometry.boundingBox.max.y;
  lm.push({ id: ids[i], x: ch.group.position.x, H: top, ch });
}
await texturesReady();
// ruler + landmark ticks
const lineMat = new THREE.LineBasicMaterial({ color: 0x9aa0a6 }), tickMat = new THREE.LineBasicMaterial({ color: 0xffc34d });
const pts = [];
const span = (ids.length - 1) / 2 * gap + 0.5;
for (let y = 0; y <= 2.0001; y += 0.1) { pts.push(new THREE.Vector3(-span, y, -0.3), new THREE.Vector3(span, y, -0.3)); }
scene.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), lineMat));
const tp = [];
for (const L of lm) for (const r of [0.63, 0.485, 0.377]) { const y = L.H * r; tp.push(new THREE.Vector3(L.x - 0.33, y, 0.4), new THREE.Vector3(L.x - 0.2, y, 0.4), new THREE.Vector3(L.x + 0.2, y, 0.4), new THREE.Vector3(L.x + 0.33, y, 0.4)); }
scene.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(tp), tickMat));
// front view (top half) and side view (bottom half), orthographic, same scale
const hh = H / 2, aspect = W / hh, vh = 2.05, vw = vh * aspect;
const camF = new THREE.OrthographicCamera(-vw / 2, vw / 2, vh - 0.02, -0.02, 0.1, 20); camF.position.set(0, 0, 8); camF.lookAt(0, 0, 0); camF.updateProjectionMatrix();
renderer.setViewport(0, hh, W, hh); renderer.setScissor(0, hh, W, hh); renderer.render(scene, camF);
for (const L of lm) L.ch.group.rotation.y = Math.PI / 2;
renderer.setViewport(0, 0, W, hh); renderer.setScissor(0, 0, W, hh); renderer.render(scene, camF);
for (const L of lm) {
  const el = document.createElement('div'); el.className = 'lbl';
  const sx = (L.x / vw + 0.5) * W;
  el.style.left = (sx - 40) + 'px'; el.style.top = '6px'; el.textContent = `${L.id} ${(L.H * 100).toFixed(0)}cm`;
  document.body.appendChild(el);
}
window.__ready = true;
</script>
</body>
</html>
